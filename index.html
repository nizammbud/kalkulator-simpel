<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="style.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Calculator</title>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="Teks-awal">
    <h2>Kalkulator simpel</h2>
  </div>
  <br><br><div class="calculator">
    <div class="display">0</div>
  <button class="operator clear">
  <i data-lucide="circle-minus"></i>
</button>

<button class="delete">
  <i data-lucide="delete"></i>
</button>

<button class="operator percent">
  <i data-lucide="percent"></i>
</button>

<button class="operator divide">
  <i data-lucide="divide"></i>
</button>

<button class="number">7</button>
<button class="number">8</button>
<button class="number">9</button>

<button class="operator multiply">
  <i data-lucide="x"></i>
</button>

<button class="number">4</button>
<button class="number">5</button>
<button class="number">6</button>

<button class="operator minus">
  <i data-lucide="minus"></i>
</button>

<button class="number">1</button>
<button class="number">2</button>
<button class="number">3</button>

<button class="operator plus">
  <i data-lucide="plus"></i>
</button>

<button class="number">0</button>
<button class="number">.</button>

<button class="equals">
  <i data-lucide="equal"></i>
</button>
</div>
<script>lucide.createIcons();</script>
<script src="script.js"></script>
</body>
</html>
